# Full stack: PostgreSQL + Django REST API + React (served by nginx).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notespw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: "compose-dev-secret-change-me"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_HOST: db
      DB_NAME: notes
      DB_USER: notes
      DB_PASSWORD: notespw
    ports:
      - "8000:8000"          # exposed for direct API testing
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
